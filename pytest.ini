# Pytest collects only the real suite. Strict markers make misspelled marks an
# error instead of silently changing test selection.
# Reproducibility gates set PYTHONHASHSEED=0 before starting Python.
[pytest]
testpaths = sjtu_tpmshx/tests
addopts = --strict-markers
markers =
    slow: heavyweight real-solve test; excluded from the CI fast subset (-m "not slow")
    fast: cheap smoke subset (opt-in via -m fast)
    heavy: call-duration >= 30s per census manifest (tests/_fast_tier_manifest.txt, conftest-applied); excluded by the development and CI subset
