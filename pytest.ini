# Pytest config (openspec change test-speedup).
#
# testpaths pins collection to the real suite so a bare `pytest` never wanders
# into .claude/worktrees/ repo copies. Markers are registered (with
# --strict-markers) so a typo'd mark fails loudly instead of silently
# collecting everything.
#
# Parallel runs: `pytest -n auto --dist loadscope` (pytest-xdist). Set
# PYTHONHASHSEED=0 in the shell FIRST — the 3D pipeline output is hash-seed
# sensitive (see .github/workflows/ci.yml header) and an env var cannot be
# pinned from inside pytest config (hash randomization is decided at
# interpreter start). loadscope keeps module-scoped surrogate/MMS fixtures
# on one worker instead of re-running them per worker.
#
# 128-core servers: `-n auto` oversubscribes and stalls (measured 2026-07-13).
# Use scripts/run_tests_server.ps1 (-n 64 --dist worksteal, two passes; the
# order-sensitive module test_df_projection_equivalence.py runs serial).
#
# CI=true semantics (HANDOFF-windows-server.md §9d): CI also gates several
# bit-exact "frozen value" tests OFF (source pins in test_df_backend_registry
# and test_df_projection_equivalence; test_evaluator_frozen_values is @slow,
# which CI skips anyway). A manual run WITHOUT CI=true executes them — green
# is expected on the attested env (requirements-lock-server.txt +
# data-repo.pin + golden_3d.meta.json); ULP/data-source failures on OTHER
# machines are a documented porting symptom, not solver bugs.
[pytest]
testpaths = sjtu_tpmshx/tests
addopts = --strict-markers
markers =
    slow: heavyweight real-solve test; excluded from the CI fast subset (-m "not slow")
    fast: cheap smoke subset (opt-in via -m fast)
