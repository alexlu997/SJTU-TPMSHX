# CI gate (openspec cleanup-ci): "not slow" pytest subset on headless Linux.
# PySide6 IS installed (offscreen): many controller/pipeline tests import Qt
# at module top with no skip gate, and skipping them would gut the CI's
# value. Other optional deps (pyvista, CoolProp) are NOT installed — those
# tests carry skipif / importorskip gates and skip cleanly. Gitignored local
# assets (models/*.joblib, data/*.xlsx) are likewise gated; the default
# gamma_df surrogate backend only reads the tracked df_surrogate/_prebuilt/
# CSVs, so solver tests run fully.
#
# PYTHONHASHSEED is pinned: the 3D pipeline output is hash-seed sensitive
# (dict/set iteration order feeds an operation order somewhere) — see
# reports/solver-efficiency-r1-r4/CONCLUSIONS.md.
name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: "0"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Install headless dependency subset
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy pandas sympy pyamg joblib numba \
                      scikit-learn matplotlib openpyxl PySide6 \
                      pytest pytest-timeout
      - name: Run fast test subset
        run: pytest sjtu_tpmshx/tests/ -q -m "not slow" --timeout=1200
