# Supported-platform smoke/static gate using the shared dependency lock.
name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            python: "3.13"
          - os: windows-2022
            python: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: "0"
      QT_QPA_PLATFORM: offscreen
      SJTU_TPMSHX_DISABLE_3D_PANEL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Run fast test subset
        run: python -m pytest sjtu_tpmshx/tests/ -q -m "not slow and not heavy" --timeout=600 --timeout-method=thread
