# CI gate (openspec cleanup-ci): "not slow and not heavy" pytest subset on
# headless Linux. Since 2026-07-20 (upgrade/loop P4.3) this also carries the
# four standing quality gates that run AS pytest tests — ruff lint
# (test_lint_gate), mypy core surface (test_type_gate), import layering
# (test_import_layering), fast-tier manifest wiring — so `ruff` + `mypy` are
# installed below. The `heavy` exclusion (P3.1 census) drops the 21 heaviest
# 3D integration tests; CI is the smoke/static tier, the local full suite
# (scripts/run_tests_server.ps1) remains the physics-regression gate.
# PySide6 IS installed (offscreen): many controller/pipeline tests import Qt
# at module top with no skip gate, and skipping them would gut the CI's
# value. CoolProp IS installed too: a batch of sCO2 tests raise ImportError
# at runtime rather than gating on import. pyvista stays out — those tests
# carry skipif / importorskip gates and skip cleanly. Gitignored local
# assets (models/*.joblib, data/*.xlsx) are likewise gated; the default
# gamma_df surrogate backend only reads the tracked df_surrogate/_prebuilt/
# CSVs, so solver tests run fully.
#
# PYTHONHASHSEED is pinned: the 3D pipeline output is hash-seed sensitive
# (dict/set iteration order feeds an operation order somewhere) — see
# reports/solver-efficiency-r1-r4/CONCLUSIONS.md.
name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: "0"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Install headless dependency subset
        # ruff + mypy are REQUIRED here since P2.1/P2.2: test_lint_gate and
        # test_type_gate subprocess `python -m ruff/mypy` with NO skip guard
        # (deliberate — the gates must not silently vanish), so a CI env
        # without them turns those tests red.
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy pandas sympy pyamg joblib numba \
                      scikit-learn scikit-image matplotlib openpyxl \
                      PySide6 CoolProp pytest pytest-timeout ruff mypy
      - name: Run fast test subset
        # timeout-method=thread: the default signal method cannot interrupt a
        # hang inside a native Qt call (observed: first-run onboarding modal
        # exec() on a fresh checkout wedged offscreen UI tests until the
        # 45-min job kill); thread mode dumps every stack and kills the
        # process so a future hang fails fast WITH a diagnosis.
        #
        # "not heavy" (P3.1 census manifest, 2026-07-20): the 21 heaviest
        # tests (>=30s local, 89% of suite compute; 3D conservation/BC/asym
        # integration) used to run here single-process. CI's role is the
        # smoke/static tier — physics regressions are the LOCAL full gate's
        # job (scripts/run_tests_server.ps1), and the ULP-pinned physics
        # tests already skip under CI=true. Manifest node-ids are
        # platform-neutral (conftest normalizes to basename).
        run: pytest sjtu_tpmshx/tests/ -q -m "not slow and not heavy" --timeout=600 --timeout-method=thread
