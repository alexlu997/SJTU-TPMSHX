name: CI

# Runs the pytest suite on every push to master and on every PR.
# Targets windows-latest to match the developer environment where the suite
# is validated. Qt tests run headless via tests/conftest.py
# (QT_QPA_PLATFORM=offscreen).
#
# The proprietary training Excel (data/raw_data/*.xlsx) is gitignored, so the
# D-F surrogate rebuilds from the committed pre-built calibrated CSVs
# (df_fit/_prebuilt), and the few tests that validate the raw-data loading
# itself (test_load_data_no_shanghai) skip when the Excel is absent. The
# Shanghai regression tests are opt-in (TPMSHX_RUN_SHANGHAI_REGRESSION, off)
# and also need the data, so they auto-skip here.

on:
  push:
    branches: [ master ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: sjtu_tpmshx
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy pandas openpyxl numba sympy matplotlib pytest pyamg PySide6 pyvista pyvistaqt

      - name: Run test suite
        # --ignore the one test needing torch/botorch (heavy; not installed).
        # Surrogate-dependent tests run via the committed pre-built CSVs;
        # raw-data tests skip (no Excel); Shanghai regression auto-skips.
        run: pytest -q --ignore=tests/test_optimizer_qnehvi_helpers.py
