name: CI

# Runs the pytest suite on every push to master and on every PR.
# Targets windows-latest to match the developer environment where the suite
# is validated. Qt tests run headless via tests/conftest.py
# (QT_QPA_PLATFORM=offscreen).
#
# The proprietary training Excel (data/raw_data/*.xlsx) is gitignored, so the
# D-F surrogate rebuilds from the committed pre-built calibrated CSVs
# (df_fit/_prebuilt), and the few tests that validate the raw-data loading
# itself (test_load_data_no_shanghai) skip when the Excel is absent. The
# Shanghai regression tests are opt-in (TPMSHX_RUN_SHANGHAI_REGRESSION, off)
# and also need the data, so they auto-skip here.

on:
  push:
    branches: [ master ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 55  # safety ceiling; warm numba cache + xdist target <15 min
    defaults:
      run:
        working-directory: sjtu_tpmshx
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Cache numba compiled kernels
        # Rolling cache: exact key never pre-exists (run_id is unique) so the
        # job always saves a fresh cache, while restore-keys restores the most
        # recent prior cache. numba self-invalidates per-function on source or
        # version change, so a stale restore just recompiles the few changed
        # kernels and reuses the rest.
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/numba_cache
          key: numba-${{ runner.os }}-py3.12-${{ github.run_id }}
          restore-keys: |
            numba-${{ runner.os }}-py3.12-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy pandas openpyxl numba sympy matplotlib pytest pytest-xdist joblib pyamg PySide6 pyvista pyvistaqt

      - name: Run test suite
        # NUMBA_CACHE_DIR is set here (step level) not at job level: the
        # `runner` context is only available in step contexts, so a job-level
        # env referencing runner.temp fails workflow validation. Kept in the
        # runner temp area (outside the source tree) so nothing is ever written
        # into the checked-out sjtu_tpmshx/ folder. 54/55 @njit kernels use
        # cache=True, so the persisted warm cache kills the cold-JIT cost.
        #
        # -n auto: parallelize across the runner's 4 vCPUs.
        # --dist loadfile: keep each test file on one worker, preserving
        #   intra-file order (guards against module-global state coupling).
        # --ignore the one test needing torch/botorch (heavy; not installed).
        # Surrogate-dependent tests run via the committed pre-built CSVs;
        # raw-data tests skip (no Excel); Shanghai regression auto-skips.
        env:
          NUMBA_CACHE_DIR: ${{ runner.temp }}/numba_cache
        run: pytest -q -n auto --dist loadfile --ignore=tests/test_optimizer_qnehvi_helpers.py
