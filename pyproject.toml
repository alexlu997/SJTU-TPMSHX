# SJTU-TPMSHX packaging (P1.8, 2026-07-20 — upgrade/loop 分支立的地基).
#
# 现状约束（诚实注记）：包内部统一使用顶层导入风格（`from solvers import ...`，
# 由各处 sys.path 引导支撑）。本文件让 `pip install -e .` 暴露 `sjtu_tpmshx`
# 包与 tpmshx-run 入口；顶层风格 → `sjtu_tpmshx.*` 的全库导入迁移是后续波次
# （ROADMAP P1.8b），迁移完成前请勿在同一进程混用两种风格导入同一模块
# （双模块对象会复制模块级缓存/注册表状态）。
#
# 版本号 0.1.0.dev0 为升级分支占位；对外版本语义合并时由 Alex 定。

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sjtu-tpmshx"
dynamic = ["version"]   # 单源：sjtu_tpmshx/_version.py（P1.9）
description = "Compressible SIMPLE/LTNE solver suite for TPMS heat exchangers (SJTU)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    # 与 requirements.txt 同源的宽松下界（服务器精确复刻用
    # requirements-lock-server.txt，见其头注）
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.0",
    "sympy>=1.13",
    "pyamg>=5.2",
    "joblib>=1.3",
    "numba>=0.60",
    "scikit-learn>=1.5",
    "matplotlib>=3.8",
    "openpyxl>=3.1",
    "CoolProp>=6.4",
    "scikit-image>=0.24",
]

[project.optional-dependencies]
gui = ["PySide6>=6.7", "pyvista>=0.45", "pyvistaqt>=0.11"]
bo = ["torch>=2.2", "botorch>=0.10", "gpytorch>=1.11"]
test = ["pytest>=8.0", "pytest-xdist>=3.5"]
dev = ["ruff>=0.15", "mypy>=2.0"]

[project.scripts]
tpmshx-run = "sjtu_tpmshx.cli:main"

[tool.ruff]
# P2.1（2026-07-21）：lint 门从最小安全集起步。format 全库重排刻意不开
# （会大规模改行号 → 腐蚀 atlas file:line 引用与源码标记 wiring 测试断言，
# 需独立评估，见 ROADMAP P2.1c）。行宽不设限（存量长行合法）。
target-version = "py311"
exclude = ["sjtu_tpmshx/runs/archive"]   # frozen 历史归档（见其 README）

[tool.ruff.lint]
# F = pyflakes（真错误类），E9 = 语法级。F841 存量 52 处已于 P2.1b（iter 23）
# 逐案清偿（死拉取删除 / Qt keep-alive 改 _ 前缀 / 副作用调用去名留调），
# 自此全量执法。
select = ["F", "E9"]

[tool.ruff.lint.per-file-ignores]
# 再导出面（拆分兼容层）与引导型导入：F401 是其存在方式
# （test_pipeline_reexports 锁面的两个模块都在内——stages_2d 首轮漏豁免，
#  被该守卫测试当场抓获，iter 22 实测）
"sjtu_tpmshx/pipelines/stages_2d.py" = ["F401"]
"sjtu_tpmshx/pipelines/stages_3d.py" = ["F401"]
"sjtu_tpmshx/**/__init__.py" = ["F401"]
# tpms_calc 是文档化的便利门面（tpms_props.py 头注）：Nu 系列/系数表/物性
# 经它再导出，下游 design/tests/ui 穿透引用——首轮 autofix 铲掉整块导致
# tests/design 收集崩（iter 22 实测），F401 永久豁免
"sjtu_tpmshx/solvers/tpms_calc.py" = ["F401"]

[tool.mypy]
# P2.2（2026-07-21）：宽松档，只锁"核心公共面"——envelope 权威、compute_pipeline
# 接缝、domain 配置/结果、CLI。运行方式（与顶层导入约定一致）：
#   cd sjtu_tpmshx && ..\.venv\Scripts\python.exe -m mypy @../mypy-core-files.txt
# 文件清单在 mypy-core-files.txt；扩圈 = 往清单加文件并清零（后续波次）。
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = true
no_implicit_optional = true

[tool.setuptools.dynamic]
version = { attr = "sjtu_tpmshx._version.__version__" }

[tool.setuptools.packages.find]
include = ["sjtu_tpmshx*"]

[tool.setuptools.package-data]
sjtu_tpmshx = [
    "configs/*.json",
    "df_surrogate/_prebuilt/*.csv",
    "validation/*.meta.json",
    "tests/_data_*.json",
]
