<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#0a1424"/>
      <stop offset="0.5" stop-color="#0c2233"/>
      <stop offset="1"   stop-color="#0a2b34"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="cardglass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6f3ff"/>
      <stop offset="1" stop-color="#9cc7ff"/>
    </linearGradient>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="380" rx="24" fill="url(#bg)"/>

  <!-- blurred colour blobs (frosted-glass colour bleed) -->
  <g filter="url(#blur)" opacity="0.85">
    <circle cx="230"  cy="120" r="150" fill="#3b82f6"/>
    <circle cx="980"  cy="90"  r="150" fill="#14b8a6"/>
    <circle cx="760"  cy="330" r="160" fill="#8b5cf6"/>
    <circle cx="430"  cy="320" r="120" fill="#0ea5e9"/>
  </g>

  <!-- faint TPMS / gyroid wave lines -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="2" fill="none">
    <path d="M0 70 C 200 20, 400 120, 600 70 S 1000 20, 1200 70"/>
    <path d="M0 150 C 200 100, 400 200, 600 150 S 1000 100, 1200 150"/>
    <path d="M0 300 C 200 250, 400 350, 600 300 S 1000 250, 1200 300"/>
  </g>

  <!-- main glass panel -->
  <rect x="32" y="30" width="1136" height="320" rx="26" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5" filter="url(#soft)"/>
  <!-- top highlight -->
  <rect x="48" y="32" width="1104" height="2" rx="1" fill="#ffffff" fill-opacity="0.30"/>

  <!-- brand diamond mark -->
  <g transform="translate(96 104) rotate(45)">
    <rect x="-26" y="-26" width="52" height="52" rx="10" fill="#3b82f6"/>
    <rect x="-26" y="-26" width="52" height="52" rx="10" fill="#ffffff" fill-opacity="0.12"/>
    <rect x="-12" y="-12" width="24" height="24" rx="5" fill="#ffffff" fill-opacity="0.85"/>
  </g>

  <!-- title + taglines -->
  <text x="150" y="100" font-size="56" font-weight="700" letter-spacing="1.5" fill="url(#title)">SJTU-TPMSHX</text>
  <text x="152" y="140" font-size="21" font-weight="600" fill="#dbeafe">Validated 2D / 3D CFD solver for TPMS heat exchangers</text>
  <text x="152" y="170" font-size="14.5" fill="#93a7c4" letter-spacing="0.3">Porous-media CFD &#183; LTNE energy &#183; dual air/water Nusselt &#183; &#949;-NTU lumped &#183; Shanghai 16-case validated</text>

  <!-- metric glass cards -->
  <g>
    <!-- card 1 -->
    <rect x="64"  y="208" width="258" height="118" rx="16" fill="url(#cardglass)" stroke="#ffffff" stroke-opacity="0.18"/>
    <rect x="64"  y="208" width="5" height="118" rx="2.5" fill="#60a5fa"/>
    <text x="88"  y="262" font-size="40" font-weight="700" fill="#ffffff">1.71<tspan font-size="22" fill="#bcd4f5">%</tspan></text>
    <text x="89"  y="292" font-size="14" fill="#cbd5e1">Air-side Q  RMSRE</text>
    <text x="89"  y="312" font-size="11.5" fill="#8aa0bd">&#949;-NTU lumped &#183; 16-case</text>

    <!-- card 2 -->
    <rect x="338" y="208" width="258" height="118" rx="16" fill="url(#cardglass)" stroke="#ffffff" stroke-opacity="0.18"/>
    <rect x="338" y="208" width="5" height="118" rx="2.5" fill="#2dd4bf"/>
    <text x="362" y="262" font-size="40" font-weight="700" fill="#ffffff">12.06<tspan font-size="22" fill="#a7e8df">%</tspan></text>
    <text x="363" y="292" font-size="14" fill="#cbd5e1">3D pressure drop</text>
    <text x="363" y="312" font-size="11.5" fill="#8aa0bd">SIMPLE 3D &#183; mass-flux inlet</text>

    <!-- card 3 -->
    <rect x="612" y="208" width="258" height="118" rx="16" fill="url(#cardglass)" stroke="#ffffff" stroke-opacity="0.18"/>
    <rect x="612" y="208" width="5" height="118" rx="2.5" fill="#a78bfa"/>
    <text x="636" y="262" font-size="40" font-weight="700" fill="#ffffff">3.30<tspan font-size="22" fill="#d6c9fb">%</tspan></text>
    <text x="637" y="292" font-size="14" fill="#cbd5e1">3D heat duty  Q</text>
    <text x="637" y="312" font-size="11.5" fill="#8aa0bd">SIMPLE 3D &#183; Nz = 10</text>

    <!-- card 4 -->
    <rect x="886" y="208" width="258" height="118" rx="16" fill="url(#cardglass)" stroke="#ffffff" stroke-opacity="0.18"/>
    <rect x="886" y="208" width="5" height="118" rx="2.5" fill="#38bdf8"/>
    <text x="910" y="262" font-size="40" font-weight="700" fill="#ffffff">1.975</text>
    <text x="911" y="292" font-size="14" fill="#cbd5e1">MMS order  p_obs</text>
    <text x="911" y="312" font-size="11.5" fill="#8aa0bd">code verification &#183; 2nd-order</text>
  </g>
</svg>
