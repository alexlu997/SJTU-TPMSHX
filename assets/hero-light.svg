<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#f4f7ff"/>
      <stop offset="0.5" stop-color="#eef5ff"/>
      <stop offset="1"   stop-color="#eafaf6"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="cardglass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.70"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#1e293b" flood-opacity="0.16"/>
    </filter>
    <filter id="cardsoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="380" rx="24" fill="url(#bg)"/>

  <!-- soft pastel colour blobs -->
  <g filter="url(#blur)" opacity="0.55">
    <circle cx="230"  cy="120" r="150" fill="#93c5fd"/>
    <circle cx="980"  cy="90"  r="150" fill="#6ee7b7"/>
    <circle cx="760"  cy="330" r="160" fill="#c4b5fd"/>
    <circle cx="430"  cy="320" r="120" fill="#7dd3fc"/>
  </g>

  <!-- faint TPMS / gyroid wave lines -->
  <g stroke="#1e3a8a" stroke-opacity="0.06" stroke-width="2" fill="none">
    <path d="M0 70 C 200 20, 400 120, 600 70 S 1000 20, 1200 70"/>
    <path d="M0 150 C 200 100, 400 200, 600 150 S 1000 100, 1200 150"/>
    <path d="M0 300 C 200 250, 400 350, 600 300 S 1000 250, 1200 300"/>
  </g>

  <!-- main glass panel -->
  <rect x="32" y="30" width="1136" height="320" rx="26" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.9" stroke-width="1.5" filter="url(#soft)"/>
  <rect x="32" y="30" width="1136" height="320" rx="26" fill="none" stroke="#c7d2fe" stroke-opacity="0.7" stroke-width="1"/>
  <!-- top highlight -->
  <rect x="48" y="33" width="1104" height="2" rx="1" fill="#ffffff" fill-opacity="0.9"/>

  <!-- brand diamond mark -->
  <g transform="translate(96 104) rotate(45)">
    <rect x="-26" y="-26" width="52" height="52" rx="10" fill="#3b82f6"/>
    <rect x="-26" y="-26" width="52" height="52" rx="10" fill="#1d4ed8" fill-opacity="0.18"/>
    <rect x="-12" y="-12" width="24" height="24" rx="5" fill="#ffffff" fill-opacity="0.95"/>
  </g>

  <!-- title + taglines -->
  <text x="150" y="100" font-size="56" font-weight="700" letter-spacing="1.5" fill="url(#title)">SJTU-TPMSHX</text>
  <text x="152" y="140" font-size="21" font-weight="600" fill="#1e3a8a">Validated 2D / 3D CFD solver for TPMS heat exchangers</text>
  <text x="152" y="170" font-size="14.5" fill="#5b6b86" letter-spacing="0.3">Porous-media CFD &#183; LTNE energy &#183; dual air/water Nusselt &#183; &#949;-NTU lumped &#183; Shanghai 16-case validated</text>

  <!-- metric glass cards -->
  <g>
    <!-- card 1 -->
    <rect x="64"  y="208" width="258" height="118" rx="16" fill="url(#cardglass)" stroke="#dbe3f4" filter="url(#cardsoft)"/>
    <rect x="64"  y="208" width="5" height="118" rx="2.5" fill="#3b82f6"/>
    <text x="88"  y="262" font-size="40" font-weight="700" fill="#0f172a">1.71<tspan font-size="22" fill="#3b82f6">%</tspan></text>
    <text x="89"  y="292" font-size="14" fill="#475569">Air-side Q  RMSRE</text>
    <text x="89"  y="312" font-size="11.5" fill="#94a3b8">&#949;-NTU lumped &#183; 16-case</text>

    <!-- card 2 -->
    <rect x="338" y="208" width="258" height="118" rx="16" fill="url(#cardglass)" stroke="#dbe3f4" filter="url(#cardsoft)"/>
    <rect x="338" y="208" width="5" height="118" rx="2.5" fill="#0d9488"/>
    <text x="362" y="262" font-size="40" font-weight="700" fill="#0f172a">&#8776;12<tspan font-size="22" fill="#0d9488">%</tspan></text>
    <text x="363" y="292" font-size="14" fill="#475569">3D pressure drop</text>
    <text x="363" y="312" font-size="11.5" fill="#94a3b8">gamma_df &#183; grid-converged</text>

    <!-- card 3 -->
    <rect x="612" y="208" width="258" height="118" rx="16" fill="url(#cardglass)" stroke="#dbe3f4" filter="url(#cardsoft)"/>
    <rect x="612" y="208" width="5" height="118" rx="2.5" fill="#7c3aed"/>
    <text x="636" y="262" font-size="40" font-weight="700" fill="#0f172a">&#8776;3<tspan font-size="22" fill="#7c3aed">%</tspan></text>
    <text x="637" y="292" font-size="14" fill="#475569">3D heat duty  Q</text>
    <text x="637" y="312" font-size="11.5" fill="#94a3b8">gamma_df &#183; grid-converged</text>

    <!-- card 4 -->
    <rect x="886" y="208" width="258" height="118" rx="16" fill="url(#cardglass)" stroke="#dbe3f4" filter="url(#cardsoft)"/>
    <rect x="886" y="208" width="5" height="118" rx="2.5" fill="#0284c7"/>
    <text x="910" y="262" font-size="40" font-weight="700" fill="#0f172a">1.975</text>
    <text x="911" y="292" font-size="14" fill="#475569">MMS order  p_obs</text>
    <text x="911" y="312" font-size="11.5" fill="#94a3b8">code verification &#183; 2nd-order</text>
  </g>
</svg>
